<!DOCTYPE html>
<html lang="en" dir="ltr" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon – DriveEase Mobile App</title>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232999E8'><path d='M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.22.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z'/></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="bg-primary text-white d-flex flex-column min-vh-100 justify-content-center py-5">

  <div class="container text-center my-auto">
    <div class="d-inline-flex align-items-center gap-2 mb-4">
      <div class="brand-logo-icon rounded-3 p-2 d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">
        <i class="bi bi-car-front-fill fs-4"></i>
      </div>
      <span class="navbar-brand-text text-white fs-3">Drive<span>Ease</span></span>
    </div>

    <div class="badge bg-warning text-dark px-3 py-2 fw-bold text-uppercase tracking-wider mb-3">Something Extraordinary Is In The Works</div>
    <h1 class="display-4 fw-extrabold text-white mb-3">DriveEase iOS & Android App Launching Soon</h1>
    <p class="text-white-50 fs-5 max-w-600 mx-auto mb-5">
      One-tap driver booking, real-time GPS proximity radar, and Apple Pay integration are arriving in your pocket.
    </p>

    <!-- Countdown Timer -->
    <div class="row g-3 justify-content-center mb-5 max-w-600 mx-auto">
      <div class="col-3">
        <div class="card-custom bg-white bg-opacity-10 border-0 text-white p-3">
          <div class="fs-1 fw-extrabold text-warning" id="countDays">34</div>
          <div class="small text-white-50 text-uppercase fw-semibold">Days</div>
        </div>
      </div>
      <div class="col-3">
        <div class="card-custom bg-white bg-opacity-10 border-0 text-white p-3">
          <div class="fs-1 fw-extrabold text-warning" id="countHours">18</div>
          <div class="small text-white-50 text-uppercase fw-semibold">Hours</div>
        </div>
      </div>
      <div class="col-3">
        <div class="card-custom bg-white bg-opacity-10 border-0 text-white p-3">
          <div class="fs-1 fw-extrabold text-warning" id="countMins">45</div>
          <div class="small text-white-50 text-uppercase fw-semibold">Mins</div>
        </div>
      </div>
      <div class="col-3">
        <div class="card-custom bg-white bg-opacity-10 border-0 text-white p-3">
          <div class="fs-1 fw-extrabold text-warning" id="countSecs">20</div>
          <div class="small text-white-50 text-uppercase fw-semibold">Secs</div>
        </div>
      </div>
    </div>

    <!-- Notify Form -->
    <div class="max-w-500 mx-auto mb-4">
      <form class="newsletter-form">
        <div class="input-group">
          <input type="email" class="form-control form-control-lg bg-white border-0" placeholder="Enter your email for early VIP beta access..." required>
          <button class="btn btn-accent btn-lg px-4" type="submit">Notify Me</button>
        </div>
      </form>
    </div>

    <div>
      <a href="index.html" class="text-white-50 text-decoration-none small hover-text-white">
        <i class="bi bi-arrow-left me-1"></i>Return to Main DriveEase Website
      </a>
    </div>
  </div>

  <script src="assets/js/theme.js"></script>
  <script src="assets/js/rtl.js"></script>
  <script src="assets/js/validation.js"></script>

  <!-- Live Countdown Timer -->
  <script>
    (function () {
      let days = 34, hours = 18, mins = 45, secs = 20;
      const elD = document.getElementById('countDays');
      const elH = document.getElementById('countHours');
      const elM = document.getElementById('countMins');
      const elS = document.getElementById('countSecs');

      setInterval(() => {
        if (secs > 0) secs--;
        else {
          secs = 59;
          if (mins > 0) mins--;
          else {
            mins = 59;
            if (hours > 0) hours--;
            else {
              hours = 23;
              if (days > 0) days--;
            }
          }
        }
        if (elD) elD.textContent = String(days).padStart(2, '0');
        if (elH) elH.textContent = String(hours).padStart(2, '0');
        if (elM) elM.textContent = String(mins).padStart(2, '0');
        if (elS) elS.textContent = String(secs).padStart(2, '0');
      }, 1000);
    })();
  </script>
</body>
</html>

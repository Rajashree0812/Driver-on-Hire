<!DOCTYPE html>
<html lang="en" dir="ltr" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your DriveEase customer portal to manage driver bookings, track assignments, and view invoices.">
  <title>Customer Login – DriveEase Professional Driver Services</title>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232999E8'><path d='M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.22.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z'/></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <!-- Minimal Top Nav -->
  <div class="py-3 px-4 d-flex justify-content-between align-items-center auth-header-nav border-bottom">
    <a href="../index.html" class="d-flex align-items-center gap-2 text-decoration-none">
      <div class="brand-logo-icon rounded-3 p-2 d-flex align-items-center justify-content-center" style="width: 38px; height: 38px;">
        <i class="bi bi-car-front-fill fs-5"></i>
      </div>
      <span class="navbar-brand-text">Drive<span>Ease</span></span>
    </a>

    <div class="d-flex align-items-center gap-2">
      <button class="switch-btn theme-toggle-btn" type="button" aria-label="Toggle Dark / Light Theme">
        <i class="bi bi-moon-stars-fill"></i>
      </button>
      <button class="switch-btn rtl-toggle-btn" type="button" aria-label="Toggle RTL / LTR">
        <span class="dir-label small fw-bold">LTR</span>
      </button>
      <a href="../index.html" class="btn btn-sm btn-outline-secondary ms-2">
        <i class="bi bi-house me-1"></i>Back to Home
      </a>
    </div>
  </div>

  <!-- Login Content Box -->
  <div class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5">
        <div class="card-custom p-4 p-md-5 shadow-lg border auth-login-card">
          <div class="text-center mb-4">
            <h3 class="fw-extrabold text-primary mb-1">Welcome Back</h3>
            <p class="text-muted small">Access your bookings, invoices, and driver tracking.</p>
          </div>

          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label small fw-semibold text-body" for="loginEmail">Email Address or Phone</label>
              <div class="input-group auth-input-group shadow-xs">
                <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-envelope"></i></span>
                <input type="email" id="loginEmail" class="form-control border-start-0" placeholder="name@example.com" required>
              </div>
            </div>

            <div class="mb-3">
              <div class="d-flex justify-content-between">
                <label class="form-label small fw-semibold text-body" for="loginPassword">Password</label>
                <a href="forgot-password.html" class="small text-accent fw-semibold text-decoration-none">Forgot password?</a>
              </div>
              <div class="input-group auth-input-group shadow-xs">
                <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-lock"></i></span>
                <input type="password" id="loginPassword" class="form-control border-start-0 border-end-0" placeholder="••••••••" required>
                <button class="btn btn-outline-secondary border-start-0 btn-toggle-password" type="button" data-target="loginPassword">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="rememberMe" checked>
              <label class="form-check-label small text-muted" for="rememberMe">
                Remember me on this browser
              </label>
            </div>

            <button type="submit" class="btn btn-accent btn-lg w-100 shadow-sm mb-3 fw-bold">
              <i class="bi bi-box-arrow-in-right me-2"></i>Sign In to Dashboard
            </button>
          </form>

          <div class="text-center small text-muted mt-3">
            Don't have an account yet? <a href="register.html" class="fw-bold text-accent text-decoration-none ms-1">Create an Account</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="py-3 text-center small text-muted auth-footer-bar border-top">
    &copy; 2026 DriveEase Technologies Inc. Professional Chauffeur Services.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/rtl.js"></script>
  <script src="../assets/js/validation.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" dir="ltr" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset your DriveEase customer account password.">
  <title>Forgot Password – DriveEase Professional Driver Services</title>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232999E8'><path d='M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.22.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z'/></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <div class="py-3 px-4 d-flex justify-content-between align-items-center bg-white border-bottom">
    <a href="../index.html" class="d-flex align-items-center gap-2 text-decoration-none">
      <div class="brand-logo-icon rounded-3 p-2 d-flex align-items-center justify-content-center" style="width: 38px; height: 38px;">
        <i class="bi bi-car-front-fill fs-5"></i>
      </div>
      <span class="navbar-brand-text">Drive<span>Ease</span></span>
    </a>

    <div class="d-flex align-items-center gap-2">
      <button class="switch-btn theme-toggle-btn" type="button" aria-label="Toggle Theme" title="Toggle Theme">
        <i class="bi bi-moon-stars-fill"></i>
      </button>
      <button class="switch-btn rtl-toggle-btn" type="button" aria-label="Toggle RTL" title="Toggle RTL">
        <span class="dir-label small fw-bold">LTR</span>
      </button>
      <a href="login.html" class="btn btn-sm btn-outline-primary ms-2">Back to Login</a>
    </div>
  </div>

  <div class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5">
        <div class="card-custom p-4 p-md-5 shadow-lg border auth-login-card">
          <div class="text-center mb-4">
            <div class="rounded-circle bg-secondary bg-opacity-10 text-secondary p-3 d-inline-flex align-items-center justify-content-center mb-3" style="width: 70px; height: 70px;">
              <i class="bi bi-key-fill fs-2"></i>
            </div>
            <h3 class="fw-extrabold text-primary mb-1">Reset Your Password</h3>
            <p class="text-muted small">Enter your email and we'll dispatch instant password recovery instructions.</p>
          </div>

          <form id="forgotPasswordForm">
            <div class="mb-4">
              <label class="form-label small fw-bold text-muted" for="resetEmail">Registered Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-envelope"></i></span>
                <input type="email" id="resetEmail" class="form-control border-start-0" placeholder="e.g. alex.morgan@example.com" required>
              </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100 shadow mb-3">
              <i class="bi bi-send-check me-2"></i>Send Reset Link
            </button>
          </form>

          <div class="text-center small text-muted mt-3">
            Remembered your password? <a href="login.html" class="fw-bold text-secondary text-decoration-none">Return to Sign In</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="py-3 text-center small text-muted bg-white border-top">
    &copy; 2026 DriveEase Technologies Inc. Frontend Authentication Demo.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/rtl.js"></script>
  <script src="../assets/js/validation.js"></script>
</body>
</html>
